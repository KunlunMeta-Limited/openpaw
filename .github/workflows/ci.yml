name: ci
on:
  push:
    branches: [main, merge/ai-ofice-react-overagent]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      # T0 wires the opt-in dependency only; runtime/CLI behavior arrives in T3.
      - run: cargo build --locked -p openpaw-cli --features engine-host,sidecar
      - name: Default CLI does not pull in the Host HTTP framework
        shell: pwsh
        run: |
          $tree = cargo tree --locked -p openpaw-cli --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tree -match '^axum v') { throw 'default CLI unexpectedly depends on axum' }

  msrv:
    # compatibility.md §2 declares an MSRV floor of 1.88. This job enforces
    # it: if any workspace crate or locked dependency needs a newer rustc,
    # the build fails here and the MSRV declaration must be revisited (raise
    # the floor via the RFC process, or pin the offending dependency).
    # History (MSRV-floor decision, devlog session 39): the floor was 1.80,
    # but the locked tree already carried edition2024 dependencies
    # (clap 4.6, rand 0.10, rmcp 1.8 — rmcp itself has no edition2021
    # release line), so 1.80 could not even parse the manifests. An
    # intermediate 1.85 floor failed on the next discovery: the rmcp
    # macro stack hard-depends on darling 0.23, which declares rustc
    # 1.88. The floor settled at 1.88 — also rmcp's own declared floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked --workspace --all-targets --all-features

  host-contracts:
    name: host-contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tests/engine-host-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: tests/engine-host-contracts/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:office
      - run: npm run check
      - run: npm test

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Q1 informational AST statistics; parse/read errors still fail.
      - run: cargo run -p xtask -- lines
      # Q10 porting hygiene
      - run: cargo run -p xtask -- scrub --check
      # Q7 trait snapshot drift
      - run: cargo run -p xtask -- snapshot --check
      # Q6 golden bidirectional read/write
      - run: cargo run -p xtask -- golden
      # Q3 zero telemetry (Cargo.lock dependency names + source call-site symbols)
      - run: cargo run -p xtask -- telemetry
      # Q2 dependency whitelist
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          arguments: --workspace
