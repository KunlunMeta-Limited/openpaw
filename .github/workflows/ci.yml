name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    # compatibility.md §2 declares an MSRV floor of 1.88. This job enforces
    # it: if any workspace crate or locked dependency needs a newer rustc,
    # the build fails here and the MSRV declaration must be revisited (raise
    # the floor via the RFC process, or pin the offending dependency).
    # History (MSRV-floor decision, devlog session 39): the floor was 1.80,
    # but the locked tree already carried edition2024 dependencies
    # (clap 4.6, rand 0.10, rmcp 1.8 — rmcp itself has no edition2021
    # release line), so 1.80 could not even parse the manifests. An
    # intermediate 1.85 floor failed on the next discovery: the rmcp
    # macro stack hard-depends on darling 0.23, which declares rustc
    # 1.88. The floor settled at 1.88 — also rmcp's own declared floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  engine-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features engine-host -- -D warnings
      - run: cargo test -p openpaw-engine-host -p openpaw-cli --features engine-host

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Q1 line budgets
      - run: cargo run -p xtask -- lines
      # Q10 porting hygiene
      - run: cargo run -p xtask -- scrub --check
      # Q7 trait snapshot drift
      - run: cargo run -p xtask -- snapshot --check
      # Q6 golden bidirectional read/write
      - run: cargo run -p xtask -- golden
      # Q3 zero telemetry (Cargo.lock dependency names + source call-site symbols)
      - run: cargo run -p xtask -- telemetry
      # Q2 dependency whitelist
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          arguments: --workspace
