name: ci
on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      # Verify the optional Host and sidecar build independently of default CLI.
      - run: cargo build --locked -p openpaw-cli --features engine-host,sidecar
      - name: Default CLI does not pull in the Host HTTP framework
        shell: pwsh
        run: |
          $tree = cargo tree --locked -p openpaw-cli --edges normal --prefix none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tree -match '^axum v') { throw 'default CLI unexpectedly depends on axum' }

  msrv:
    # README declares Rust 1.89 as the minimum supported compiler.
    # Check the actual locked dependency graph on both native platforms.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked --workspace --all-targets --all-features

  host-contracts:
    name: host-contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tests/engine-host-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: tests/engine-host-contracts/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:office
      - run: npm run check
      - run: npm test

  quality-gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Q1 informational AST statistics; parse/read errors still fail.
      - run: cargo run --locked -p xtask -- lines
      # Q10 porting hygiene
      - run: cargo run --locked -p xtask -- scrub --check
      # Q7 trait snapshot drift
      - run: cargo run --locked -p xtask -- snapshot --check
      # Q6 golden bidirectional read/write
      - run: cargo run --locked -p xtask -- golden
      # Q3 zero telemetry (Cargo.lock dependency names + source call-site symbols)
      - run: cargo run --locked -p xtask -- telemetry
      - run: cargo run --locked -p xtask -- stability
      - run: cargo run --locked -p xtask -- smoke-offline
      # Q2 dependency whitelist
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2, cargo-deny 0.20.2
        if: runner.os == 'Linux'
        with:
          arguments: --workspace
          rust-version: stable
      # D30: container Actions cannot execute on Windows; keep the same pinned native audit.
      - name: Install native Windows dependency auditor
        if: runner.os == 'Windows'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies natively on Windows
        if: runner.os == 'Windows'
        run: cargo deny --workspace check

  technical-review:
    name: technical-review (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the technical executor with real subprocesses
        shell: pwsh
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_ROOT: ${{ runner.temp }}/openpaw-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/verify.py --suite runner --source head --head $env:REVIEW_HEAD --output "$env:REPORT_ROOT/runner"
          exit $LASTEXITCODE
      - name: Check Rustdoc against the exact review base
        shell: pwsh
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_ROOT: ${{ runner.temp }}/openpaw-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $base = $env:REVIEW_BASE
          if (-not $base -or $base -match '^0+$') {
            $base = git rev-parse "$($env:REVIEW_HEAD)^"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo run --locked -p xtask -- comments --base $base --head $env:REVIEW_HEAD 2>&1 | Tee-Object -FilePath "$env:REPORT_ROOT/comments.log"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-review-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openpaw-review-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
