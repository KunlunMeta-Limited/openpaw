name: governance

on:
  pull_request:
  workflow_dispatch:

jobs:
  governance:
    name: OpenPaw 治理门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 校验项目和 CHG
        run: python governance/check.py validate --profile governance/project-profile.toml
      - name: 校验 JSON Schema
        run: python governance/check.py contracts --dir contracts
      - name: 生成 CHG 索引
        run: python governance/check.py index --changes docs/changes --output docs/changes/INDEX.md
      - name: 历史中文注释报告
        run: python governance/check.py comments --root . --language rust --all --report-only
      - name: PR 范围和审批门禁
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python governance/check.py pr-check --profile governance/project-profile.toml --repository openpaw-main --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: 新增代码中文注释门禁
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python governance/check.py comments-diff --root . --language rust --base "$BASE_SHA" --head "$HEAD_SHA"
