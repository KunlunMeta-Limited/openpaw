# rustup dist mirror does not carry versioned manifests (404 on
# `1.98.0-x86_64-pc-windows-msvc` sync), so the channel is pinned to
# `stable` (currently 1.98.0) while the MSRV floor stays at 1.88
# (workspace.package.rust-version; raised from 1.80 by the MSRV-floor
# decision, devlog session 39 — the locked tree carries edition2024
# dependencies and the rmcp macro stack needs darling 0.23 / rustc 1.88).
# Reproducible builds remain anchored by Cargo.lock + --locked; revisit a
# hard version pin at M6.
