# cargo-deny configuration — dependency whitelist enforcement (Q2).
# Banned families (dev plan section 1.2):
#   - Browser stack: deno_core / v8 / tokio-tungstenite
#   - Cloud SDKs: aws-* (allowed only behind the `bedrock` feature, never default)
#   - Any workspace path dep outside this repository (no upstream leakage)

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
# 仅放行现有 crate 的具体许可证，不扩大其他依赖的全局许可集合。
# option-ext 使用文件级 MPL；webpki-roots 分发 CDLA 许可的根证书数据。
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "deno_core" },
    { name = "v8" },
    { name = "tokio-tungstenite" },
    { name = "aws-config" },
    { name = "aws-sdk-bedrockruntime" },
    { name = "aws-credential-types" },
    { name = "aws-sigv4" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
