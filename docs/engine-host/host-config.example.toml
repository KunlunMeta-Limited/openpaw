# Linux示例：先建立独立目录/home/user/openpaw-data以及/home/user/project、project-2、project-3、project-4。
# Windows原生：使用正斜杠路径，例如home = "C:/Users/user/openpaw-data"，root = "C:/Users/user/project"。
# home与所有工作根互不包含；不能把项目根设成用户整个home或磁盘根。
home = "/home/user/openpaw-data"
# 明确填写优先于.env。沿用统一.env模型时省略下面provider/model/base_url/api_key_env。
# 默认.env：OPENPAW_HOME/.env或用户目录/.openpaw/.env；也可用--env-file指定。
provider = "echo" # 保留原离线演示；希望使用.env时删除或注释这一行
# model = "gpt-4o"
# api_key_env = "OPENAI_API_KEY" # 只填变量名，值可来自系统环境或.env；省略时按Provider选标准名
# base_url = "https://api.openai.com/v1"
max_active_runs = 4
run_timeout_secs = 1800
# 等待建立响应流及每个有效模型事件的最大空闲时间；不是整个任务时限。
# 慢模型可显式调整为180秒；上游心跳不一定产生有效事件，超时不等于确定断网。
stream_idle_secs = 60
tool_timeout_secs = 300
approval_timeout_secs = 300
# 写入和bash需显式加入；每次调用仍必须通过Host持久审批。
tools = ["read_file", "glob", "grep", "todo_list", "think"]
# 需要查询天气、公开资料等时，用下面一行替换上行；不改Office或模型.env。
# tools = ["read_file", "glob", "grep", "todo_list", "think", "web_search", "web_fetch"]
# 联网工具使用原HTTP客户端/系统代理；fresh绕本地缓存不保证站点数据为当天。
# 公开站点超时/反爬/动态页面可能无法获取有效数据，不以旧数据伪装实时结果。
# T5显式开放示例：在上方tools数组逐项加入write_file、edit_file、todo_add、todo_update或bash。
# 每call都要在Office菜单选择“允许本次”；不提供永久允许。notebook_edit/sleep未向Office开放。
# bash在Linux使用sh、Windows使用cmd；这是普通本机执行，具有当前用户权限，根锁不构成OS隔离。
# 不可落实的受限执行仍拒绝，不能降为普通执行；取消保持cancelling直到进程/管道清理完成。
# Windows原生验证按用户安排暂缓，示例可移植不等于已经发布验证。
# T7预留：必须成对配置，T4启用office段后增加官方聊天接口；OpenCode认证路由尚未交付。
# basic_username_env = "OPENPAW_HOST_USER"
# basic_password_env = "OPENPAW_HOST_PASSWORD"
[roots]
project = "/home/user/project"
project-2 = "/home/user/project-2"
project-3 = "/home/user/project-3"
project-4 = "/home/user/project-4"
[slots]
office-1 = "project"
office-2 = "project-2"
office-3 = "project-3"
office-4 = "project-4"

# Office接入：取消以下注释才启用；默认tools仍只读。
# 不填模型字段即可沿用原生 ~/.openpaw/.env 的DeepSeek配置。
# Office服务密钥是独立的系统环境 PAWOFFICE_API_KEY，不能用模型密钥替代。
# [office]
# base_url = "http://127.0.0.1:8765"
# api_key_env = "PAWOFFICE_API_KEY"
# allowed_origins = ["http://127.0.0.1:8765"]
# 先在[roots]/[slots]声明真实根及稳定槽，再把等待页面创建的槽填入此项。
# 默认空，全部原办公室仍自动初始化；每槽只分配一次，名称不变成路径。
# activity_window = true # 可选：人物只显示在途/排队任务，标题显示真实工具动作；页面计数变为当前窗口口径。
# creation_slots = [] # 例如 ["office-reserved"]；该槽须已在[slots]存在
# [office.names]
# office-1 = "研发办公室"
# office-2 = "产品办公室"
# office-3 = "资料办公室"
# office-4 = "测试办公室"

# 团队内主Agent与所有子Agent共用该团队根；默认各团队使用独立物理目录。
# 既有共享目录不能直接改slots后启动。先停止Host，生成只读迁移计划并审核摘要，
# 再以全新备份目录apply；旧配置/原项目文件/JSONL保留。不要把plan文件放入源工作根。
# 模型.env仍保留在OpenPaw官方配置位置。若与Host业务home混放，预检明确拒绝，
# 不复制密钥，也不以省略该文件的方式宣称完整home备份。
# openpaw engine-host-workspace plan --config old.toml --target-config target.toml --team office-2,office-3,office-4 > plan.json
# 上行为Linux shell用法。Windows PowerShell 5.1的 > 默认写UTF-16，不能直接用于JSON计划。
# PowerShell先捕获输出并检查退出码，再用无BOM UTF-8写入：
# $plan = & .\openpaw.exe engine-host-workspace plan --config old.toml --target-config target.toml --team office-2,office-3,office-4
# if ($LASTEXITCODE -ne 0) { throw '迁移预检失败；不保存计划' }
# [IO.File]::WriteAllText((Join-Path (Get-Location) 'plan.json'), ($plan -join "`n"), [Text.UTF8Encoding]::new($false))
# openpaw engine-host-workspace apply --config old.toml --target-config target.toml --plan plan.json --confirm-sha256 <计划sha256> --backup <全新备份目录>
# 成功后才用target.toml启动；回退时先停新Host，再恢复完整配套home和old.toml，
# 新根中新产物另行保留，不以回退为由删除。共享根仅为明确配置的可选旧行为。

# 单对话持续协作：以下是显式启用示例，不能直接追加为同名重复TOML表。
# 将上方max_active_runs改为6、run_timeout_secs改为0；零只取消总时限，
# 网络空闲、单工具和审批超时继续生效。tools按需增加write_file/edit_file/render_visual/generate_image。
# [agents]
# enabled = true
# max_active_children = 5
# max_delegations = 0
# max_model_requests = 0
# max_output_tokens = 0
# max_response_tokens = 16384 # 可选：协作主子Run单次响应上限；不是整组累计预算，模型需实际支持。
# [agents.continuous]
# enabled = true
# output_dir = "outputs"
# auto_approve = true
# stage_pause_ms = 250
# 同时开放的业务事项上限，不是子Agent数量。
max_open_items = 2
# 独立生图服务可选；DeepSeek聊天密钥不会自动作为图片凭据。
# 地址须支持POST /images/generations，返回data[0].b64_json实际PNG/JPEG/WebP。
# [agents.images]
# base_url = "https://your-image-service.example/v1"
# model = "your-image-model"
# api_key_env = "OPENPAW_IMAGE_API_KEY"
# OPENPAW_IMAGE_API_KEY的值放在原 ~/.openpaw/.env（或--env-file指定文件）；不写入TOML/仓库。
# 若服务要求显式response_format，可在[agents.images]配置 response_format = "b64_json"；
# 默认省略该字段，避免向不支持此参数的服务发送它。只支持实际base64结果，不自动下载返回URL。
