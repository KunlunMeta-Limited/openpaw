schema = "ai-governance/project/v1"
project_id = "openpaw-office-host"
display_name = "OpenPaw Office 接入工程治理"
changes_dir = "docs/changes"
baseline = ["docs/requirements/产品需求说明.md", "docs/design/软件设计说明.md", "docs/engine-host/master.md"]
contract_dirs = ["docs/engine-host/contracts"]
platforms = ["linux", "windows"]
python_minimum = "3.11"
integration_branch = "merge/ai-ofice-react-overagent"
initial_tx_phase = true
normal_target_branch = "main"
phase_exit_evidence = "待T0—T8约定范围全部验收后人工登记，不能由工具自动结束"

chg_format = "openpaw/chg-review-v2"

[owners]
reviewer = "用户或指定非作者审核人；GitHub账号尚待人工配置"
approval_policy = "CI不认证批准字段；以真实用户指令和当前提交PR审核为准"

[[repositories]]
id = "openpaw"
root = "."
language = "rust"

[[protected_paths]]
repository = "openpaw"
pattern = "crates/openpaw-core/**"
level = "L4"
owner = "架构审核人"
reason = "核心公共契约"

[[protected_paths]]
repository = "openpaw"
pattern = "crates/openpaw-engine/**"
level = "L4"
owner = "运行与权限审核人"
reason = "运行生命周期、授权和工具执行"

[[protected_paths]]
repository = "openpaw"
pattern = "crates/openpaw-store/**"
level = "L4"
owner = "数据审核人"
reason = "会话事实与持久化"

[[protected_paths]]
repository = "openpaw"
pattern = "crates/openpaw-sandbox/**"
level = "L4"
owner = "执行安全审核人"
reason = "平台权限、隔离和进程清理"

[[protected_paths]]
repository = "openpaw"
pattern = "crates/openpaw-tools/**"
level = "L4"
owner = "工具权限审核人"
reason = "工具副作用与权限"

[[protected_paths]]
repository = "openpaw"
pattern = "crates/openpaw-engine-host/**"
level = "L4"
owner = "宿主审核人"
reason = "协议、工作区、审批与恢复；后续细分不降低授权边界"

[[protected_paths]]
repository = "openpaw"
pattern = "governance/**"
level = "L4"
owner = "治理审核人"
reason = "门禁自身不可无审查降低"

