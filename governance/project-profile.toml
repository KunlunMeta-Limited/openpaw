schema = "ai-governance/project/v1"
project_id = "openpaw-main-b-line"
display_name = "OpenPaw B 线受控治理"
language = ["rust"]
baseline = [
  "docs/governance/项目设计基线.md",
  "docs/governance/需求验收基线.md",
]
changes_dir = "docs/changes"
contract_dirs = ["contracts"]

[owners]
architecture = "OpenPaw 架构负责人"
api = "Host 接口负责人"
security = "安全与依赖负责人"
test = "OpenPaw 测试负责人"

[[repositories]]
id = "openpaw-main"
root = "."
language = "rust"

[[protected_paths]]
repository = "openpaw-main"
level = "L4"
pattern = "crates/openpaw-core/src/**"
owner = "核心架构负责人"
reason = "核心 trait 和数据结构会影响全部上层 crate，必须经过架构和兼容性审查"

[[protected_paths]]
repository = "openpaw-main"
level = "L4"
pattern = "crates/openpaw-engine/src/agent_loop.rs"
owner = "引擎负责人"
reason = "AgentLoop 决定回合状态、工具调用、取消和事件顺序，是运行时基础边界"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-engine-host/src/protocol.rs"
owner = "Host 接口负责人"
reason = "OpenCode v1 协议类型、字段和序列化规则属于跨项目公共契约"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-engine-host/src/http.rs"
owner = "Host 接口负责人"
reason = "路由、鉴权、错误码和 session 状态是对外 HTTP 边界"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-engine-host/src/events.rs"
owner = "Host 接口负责人"
reason = "SSE 事件字段和顺序被 OpenWork SDK 消费，修改会造成协议不兼容"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-engine-host/src/runtime.rs"
owner = "Host 运行时负责人"
reason = "session 生命周期、并发保留、取消和 JSONL 持久化的所有权集中于此"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-engine-host/src/approval.rs"
owner = "安全负责人"
reason = "人工审批、权限请求和 abort 清理属于安全与状态机边界"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-engine-host/src/office.rs"
owner = "跨项目接口负责人"
reason = "Office 动作生产和失败隔离规则影响 AI Office 消费端"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-engine-host/Cargo.toml"
owner = "构建负责人"
reason = "可选 feature 和 Host 依赖必须保持默认构建隔离"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "crates/openpaw-cli/Cargo.toml"
owner = "构建负责人"
reason = "CLI feature 传播决定默认依赖树是否引入 Host"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "Cargo.toml"
owner = "构建负责人"
reason = "workspace 依赖、feature 和成员关系影响全部构建目标"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = "Cargo.lock"
owner = "构建负责人"
reason = "锁文件决定可复现依赖解析，新增 axum 等依赖必须可追踪"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = ".github/workflows/**"
owner = "发布与安全负责人"
reason = "CI 是合并门禁和发布证据入口"

[[protected_paths]]
repository = "openpaw-main"
level = "L3"
pattern = ".github/CODEOWNERS"
owner = "架构负责人"
reason = "CODEOWNER 决定基础路径的人工复核责任"

[[commands]]
name = "格式检查"
repository = "openpaw-main"
run = "cargo fmt --all -- --check"
risk = "low"

[[commands]]
name = "Host 集成测试"
repository = "openpaw-main"
run = "cargo test -p openpaw-engine-host --features engine-host"
risk = "high"

[[commands]]
name = "工作区测试"
repository = "openpaw-main"
run = "cargo test --workspace"
risk = "medium"

[[commands]]
name = "默认依赖树无 axum"
repository = "openpaw-main"
run = "cargo tree -p openpaw-cli --no-default-features"
risk = "high"

[[commands]]
name = "行数门禁"
repository = "openpaw-main"
run = "cargo run -p xtask -- lines"
risk = "medium"
