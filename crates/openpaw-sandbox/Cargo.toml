[package]
name = "openpaw-sandbox"
description = "Cross-platform sandbox for secure command execution (Windows Restricted Token + Job Object, Linux bwrap)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true
dirs.workspace = true
regex.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# The Windows Restricted Token / Job Object and Unix flock backends require
# raw FFI. This crate is the single deliberate exception to the workspace
# `unsafe_code = "forbid"` discipline (see README.md, architecture and module boundaries):
# the workspace stays on `forbid`, this crate locally downgrades to `allow`,
# mirroring the upstream sandbox crate's lint setup.
unsafe_code = "allow"

[[test]]
name = "managed_process_regressions"
path = "tests/regressions/managed_process.rs"
