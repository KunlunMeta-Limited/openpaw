[package]
name = "openpaw-engine-host"
description = "OpenCode-compatible public engine interface adapter (M5b, gated behind a validation checkpoint)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
engine-host = ["dep:anyhow", "dep:axum", "dep:base64", "dep:serde", "dep:serde_json", "dep:tokio", "dep:uuid", "dep:chrono", "dep:openpaw-core", "dep:openpaw-engine", "dep:openpaw-llm", "dep:openpaw-store", "dep:openpaw-tools", "dep:futures", "dep:async-trait"]

[dependencies]
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
openpaw-core = { workspace = true, optional = true }
openpaw-engine = { workspace = true, optional = true }
openpaw-llm = { workspace = true, optional = true }
openpaw-store = { workspace = true, optional = true }
openpaw-tools = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[dev-dependencies]
# Drives the assembled `Router` in the HTTP contract tests (`oneshot`).
tower = { workspace = true }

[lints]
workspace = true
