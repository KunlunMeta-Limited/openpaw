[package]
name = "openpaw-cli"
description = "The openpaw binary: chat entry points and management commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "openpaw"
path = "src/main.rs"

[features]
default = []
# MCP sidecar server (rmcp).
sidecar = ["dep:rmcp"]
# T0 only wires the opt-in build surface; the Host command is delivered in T3.
engine-host = ["dep:openpaw-engine-host", "openpaw-engine-host/engine-host"]

[dependencies]
openpaw-core.workspace = true
openpaw-engine.workspace = true
openpaw-engine-host = { workspace = true, optional = true }
openpaw-goal-ledger.workspace = true
openpaw-llm.workspace = true
openpaw-memory.workspace = true
openpaw-reflect-lite.workspace = true
openpaw-store.workspace = true
openpaw-tools.workspace = true
rmcp = { workspace = true, optional = true }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "chat_persistence_regressions"
path = "tests/regressions/chat_persistence.rs"
